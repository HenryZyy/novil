services:
  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    container_name: novil-backend
    restart: unless-stopped
    user: "${NOVIL_UID:-1000}:${NOVIL_GID:-1000}"
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
      - ./library:/library:ro
